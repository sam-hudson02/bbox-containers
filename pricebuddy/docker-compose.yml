# PriceBuddy, a price tracker: products, one or more shop URLs each, price
# history and notifications when a price drops.
#
# Adapted from the upstream compose:
#   https://github.com/jez500/pricebuddy/blob/main/docker-compose.yml
#
# Differences from upstream:
#
# 1. Secrets come from .env through ${VAR:?}, not literals in this file.
# 2. No ./.env mounted into the app. Upstream mounts one so the first boot can
#    write a generated APP_KEY into it. Here .env is the SOPS-generated secrets
#    file and is rewritten on every deploy, so a generated key would be lost and
#    everything the app encrypts with it would stop decrypting. APP_KEY is set
#    as an environment variable instead, which Laravel prefers over the file.
# 3. MySQL 8.4 LTS rather than 8.2, which is an end-of-life innovation release.
# 4. State in bind mounts under the stack directory, so a backup is a path.
# 5. The scraper's port is not published. Only the app talks to it.
# 6. Affiliate link rewriting off.
name: pricebuddy

services:
  app:
    image: jez500/pricebuddy:${PRICEBUDDY_VERSION:-v1.0.54}
    container_name: pricebuddy
    restart: unless-stopped
    ports:
      # Plain HTTP on trusted, with the app's own login in front.
      - "8080:80"
    volumes:
      - ./storage:/app/storage
    environment:
      TZ: Europe/London
      APP_TIMEZONE: Europe/London
      APP_URL: ${APP_URL:?}
      APP_KEY: ${APP_KEY:?}
      DB_HOST: database
      DB_DATABASE: pricebuddy
      DB_USERNAME: pricebuddy
      DB_PASSWORD: ${DB_PASSWORD:?}
      # Only read when the database is first seeded. Changing them later does
      # nothing; change the password in the app instead.
      APP_USER_EMAIL: ${APP_USER_EMAIL:?}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?}
      SCRAPER_BASE_URL: http://scraper:3000
      # Upstream defaults to true, which adds the project's affiliate codes to
      # buy links. See https://pricebuddy.jez.me/support-project.html
      AFFILIATE_ENABLED: "false"
    # The start script runs `printenv`, so every value above, secrets included,
    # is in `docker logs pricebuddy`. Local to this box, but don't paste them.
    depends_on:
      database:
        condition: service_healthy
      scraper:
        condition: service_started

  database:
    image: mysql:8.4
    container_name: pricebuddy_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pricebuddy
      MYSQL_USER: pricebuddy
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - ./mysql:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m

  scraper:
    # SeleniumBase with headless Chrome, for shops that only render prices with
    # JavaScript. Stores choose between it and a plain HTTP fetch.
    image: jez500/seleniumbase-scrapper:v1.0
    container_name: pricebuddy_scraper
    restart: unless-stopped
    # Chrome crashes tabs on Docker's default 64 MB of shared memory.
    shm_size: 1g
    # Chrome grows with every open page. The guest is capped at 6 GB and shares
    # it with immich-ml.
    mem_limit: 2g
