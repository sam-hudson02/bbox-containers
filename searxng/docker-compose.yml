# SearXNG, a self-hosted metasearch front end: it forwards a query to other
# engines and returns the results with no account, no tracking and no ads.
#
# Adapted from the upstream compose:
#   https://github.com/searxng/searxng/blob/master/container/docker-compose.yml
# The old searxng-docker repo is deprecated; that file is the current one.
#
# Differences from upstream:
#
# 1. Published on 8081. PriceBuddy already has 8080 on this guest.
# 2. Settings and cache in bind mounts under the stack directory rather than
#    named volumes, so a backup is a path.
# 3. Valkey wired up explicitly. Upstream ships the service but leaves the URL
#    unset, and without it the limiter and result cache are disabled.
# 4. settings.yml comes from this repo, not from the container's first-start
#    template, so a rebuilt guest gets the same search config. The secret it
#    would have generated comes from .env instead.
# 5. FORCE_OWNERSHIP off. The entrypoint would otherwise chown the config
#    directory to uid 977, and the next deploy could not write settings.yml.
name: searxng

services:
  core:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    ports:
      # 8080 inside the container, whatever EXPOSE says; only the published
      # port moves.
      - "8081:8080"
    volumes:
      # settings.yml is deployed into here from this repo. The container only
      # writes its own template when the file is missing, so it leaves this
      # alone. Edit the copy in the repo and redeploy, not the one on the box.
      - ./config:/etc/searxng
      # Favicon and result caches. Regenerated by use.
      - ./cache:/var/cache/searxng
    environment:
      TZ: Europe/London
      # Used to build absolute links. It has to match what goes in the browser,
      # so change it if a Caddy route is added.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://192.168.1.152:8081}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      # The container runs as root and reads the config as root. Left true, its
      # entrypoint takes ownership of the config directory and locks the deploy
      # out of it.
      FORCE_OWNERSHIP: "false"
      SEARXNG_VALKEY_URL: redis://valkey:6379/0
      # Bot protection for public instances. This one is on trusted and reached
      # by one person; the limiter would only rate-limit that person.
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    # Search results are text, but the engines are many and the image proxy
    # buffers thumbnails.
    mem_limit: 1g
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng_valkey
    restart: unless-stopped
    # Upstream's flags: snapshot if anything changed in the last 30s, and stay
    # quiet in the log.
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ./valkey:/data
    mem_limit: 256m
